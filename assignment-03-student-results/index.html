<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practical 3: Student Result Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <h1>Student Result Management System</h1>
    <p>HTML, CSS &amp; Vanilla JavaScript Practical</p>
  </header>

  <div class="container">

    <!-- Topper Display Banner -->
    <div class="topper-box" id="topperBox">
      <h3>🏆 Class Topper</h3>
      <p id="topperText">Loading topper details...</p>
    </div>

    <!-- Student Marks Entry Form -->
    <section class="card">
      <h2>Enter Student Details &amp; Marks</h2>
      <form id="studentForm">
        
        <div class="form-row">
          <div class="form-group">
            <label for="name">Student Name:</label>
            <input type="text" id="name" placeholder="Enter student name" required>
          </div>
          <div class="form-group">
            <label for="rollNo">Roll Number:</label>
            <input type="text" id="rollNo" placeholder="e.g. 24BIT01" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="marks1">Subject 1 (Web Tech) Marks [0-100]:</label>
            <input type="number" id="marks1" min="0" max="100" placeholder="Marks (0-100)" required>
          </div>
          <div class="form-group">
            <label for="marks2">Subject 2 (DBMS) Marks [0-100]:</label>
            <input type="number" id="marks2" min="0" max="100" placeholder="Marks (0-100)" required>
          </div>
          <div class="form-group">
            <label for="marks3">Subject 3 (OS) Marks [0-100]:</label>
            <input type="number" id="marks3" min="0" max="100" placeholder="Marks (0-100)" required>
          </div>
        </div>

        <div class="btn-group">
          <button type="submit" class="btn btn-add">Add Student</button>
          <button type="reset" class="btn btn-clear">Clear Form</button>
        </div>

      </form>
    </section>

    <!-- Dynamic Records Table -->
    <section class="card">
      <h2>Student Records Table</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Roll No</th>
              <th>Name</th>
              <th>Sub 1</th>
              <th>Sub 2</th>
              <th>Sub 3</th>
              <th>Total (/300)</th>
              <th>Percentage</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="studentTableBody">
            <!-- Student rows will be added here dynamically by JavaScript -->
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <footer>
    <p>&copy; 2026 Student Result Management System - Practical 03</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
