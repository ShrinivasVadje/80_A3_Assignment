<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practical 4: Employee Registration Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <h1>Employee Registration System</h1>
    <p>HTML, CSS &amp; JavaScript Client-Side Form Validation</p>
  </header>

  <div class="container">
    
    <!-- Success Message Box (Hidden by default) -->
    <div id="successBox" class="success-message">
      Registration successful! Employee details have been validated.
    </div>

    <!-- Registration Form Card -->
    <div class="form-card">
      <h2>Employee Registration Form</h2>
      <p class="subtitle">Please fill out all fields below:</p>

      <form id="registrationForm" novalidate>

        <!-- Full Name -->
        <div class="form-group">
          <label for="name">Employee Full Name:</label>
          <input type="text" id="name" placeholder="Enter full name">
          <span id="nameError" class="error-text"></span>
        </div>

        <!-- Email Address -->
        <div class="form-group">
          <label for="email">Email Address:</label>
          <input type="text" id="email" placeholder="e.g. employee@company.com">
          <span id="emailError" class="error-text"></span>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Password (Minimum 6 characters):</label>
          <input type="password" id="password" placeholder="Enter password">
          <span id="passwordError" class="error-text"></span>
        </div>

        <!-- Phone Number -->
        <div class="form-group">
          <label for="phone">Phone Number (10 digits):</label>
          <input type="text" id="phone" placeholder="e.g. 9876543210" maxlength="10">
          <span id="phoneError" class="error-text"></span>
        </div>

        <!-- Department -->
        <div class="form-group">
          <label for="department">Select Department:</label>
          <select id="department">
            <option value="">-- Choose Department --</option>
            <option value="Information Technology">Information Technology</option>
            <option value="Human Resources">Human Resources</option>
            <option value="Finance">Finance</option>
            <option value="Marketing">Marketing</option>
            <option value="Operations">Operations</option>
          </select>
          <span id="departmentError" class="error-text"></span>
        </div>

        <!-- Action Buttons -->
        <div class="btn-group">
          <button type="submit" class="btn btn-submit">Register Employee</button>
          <button type="button" id="resetBtn" class="btn btn-reset">Clear</button>
        </div>

      </form>
    </div>

  </div>

  <footer>
    <p>&copy; 2026 Employee Registration System - Practical 04 Submission</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
